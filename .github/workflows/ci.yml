# 百工·锻 CI —— develop 分支：日常开发门禁（Tauri + React）。
# 三分支分工：
#   develop → ci.yml：前端构建+测试门禁 + cargo check 门禁；
#   qa      → qa.yml：门禁 + Windows 试用安装包；
#   main    → release.yml：门禁 + 正式安装包 + GitHub Release。

name: CI 门禁 (develop)

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, qa, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-gate:
    name: 前端门禁 (tsc + vite build + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # fang 走 alias 联调轨（vite alias + tsconfig paths 指向 ../fang/src），
      # runner 只有本仓库，须把 fang 检出为兄弟目录，否则 tsc 报 Cannot find module '@baigong/fang'。
      # 仓库私有化或 fang 上 registry 后此步骤移除。
      - name: 检出 fang（alias 联调的兄弟仓库）
        uses: actions/checkout@v4
        with:
          repository: Bai-Gong/fang
          ref: main
          path: fang
      # checkout 只允许工作区内路径，检出到 fang/ 后挪到兄弟目录 ../fang
      - name: fang 挪到兄弟目录
        run: mv fang ../fang
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # fang 源码里的 import "react" 从 fang 自己的 node_modules 向上解析，裸检出会 TS2307
      - name: 安装 fang 依赖
        run: npm ci --prefix ../fang
      - name: 安装并构建、测试
        run: |
          npm ci
          npm run build
          npm test
      # vitest 零测试文件期靠 vitest.config.ts 的 passWithNoTests 保绿（首个 *.test.ts 随核心层落地）
      - name: 上传构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: dist/
          retention-days: 3
          if-no-files-found: ignore

  rust-gate:
    name: Rust 门禁 (cargo check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libxdo-dev libayatana-appindicator3-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
