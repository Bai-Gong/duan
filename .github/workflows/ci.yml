# 百工·锻 CI —— develop 分支：日常开发门禁（Tauri + React）。
# 三分支分工：
#   develop → ci.yml：前端构建+测试门禁 + cargo check 门禁；
#   qa      → qa.yml：门禁 + Windows 试用安装包；
#   main    → release.yml：门禁 + 正式安装包 + GitHub Release。

name: CI 门禁 (develop)

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, qa, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-gate:
    name: 前端门禁 (tsc + vite build + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装并构建、测试
        run: |
          npm ci
          npm run build
          npm test
      # vitest 零测试文件期靠 vitest.config.ts 的 passWithNoTests 保绿（首个 *.test.ts 随核心层落地）
      - name: 上传构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: dist/
          retention-days: 3
          if-no-files-found: ignore

  rust-gate:
    name: Rust 门禁 (cargo check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libxdo-dev libayatana-appindicator3-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: 桌面外壳检查
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  windows-package:
    name: 界面预览安装包 (Windows)
    needs: [web-gate, rust-gate]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装依赖
        run: |
          npm ci
      # 不下载 FFmpeg；打包脚本会检查实际 NSIS 载荷清单。
      - name: 构建并检查界面预览安装包
        run: npm run package:windows
      - uses: actions/upload-artifact@v4
        with:
          name: ui-preview-windows-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
          if-no-files-found: error
