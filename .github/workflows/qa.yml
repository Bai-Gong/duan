# 百工·锻 QA —— qa 分支：门禁复跑 + Windows 试用安装包。
# 三分支分工：develop 门禁 / qa 本文件 / main 正式发布。

name: QA 流水线 (qa)

on:
  push:
    branches: [qa]
  workflow_dispatch:

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-gate:
    name: 前端门禁 (tsc + vite build + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # fang 兄弟仓库检出（原因见 ci.yml 同名步骤注释）
      - name: 检出 fang（alias 联调的兄弟仓库）
        uses: actions/checkout@v4
        with:
          repository: Bai-Gong/fang
          ref: 21c522dba3c1444060c5cd6ebd4e6760d21f9b38
          path: fang
      # checkout 只允许工作区内路径，检出到 fang/ 后挪到兄弟目录 ../fang
      - name: fang 挪到兄弟目录
        run: mv fang ../fang
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # fang 源码里的 import "react" 从 fang 自己的 node_modules 向上解析，裸检出会 TS2307
      - name: 安装 fang 依赖
        run: npm ci --prefix ../fang
      - name: 安装并构建、测试
        run: |
          npm ci
          npm run build
          npm test

  rust-gate:
    name: Rust 门禁 (cargo check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ye 兄弟仓库检出（原因见 ci.yml 同名步骤注释；cargo check 需 ../ye）
      - name: 检出 ye（ye 引擎依赖的兄弟仓库）
        uses: actions/checkout@v4
        with:
          repository: Bai-Gong/ye
          ref: e30724896b8bc8e645b86d1585bb51acdcfef6c1
          path: ye
      - name: ye 挪到兄弟目录
        run: mv ye ../ye
      - name: 安装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libxdo-dev libayatana-appindicator3-dev libssl-dev pkg-config ffmpeg
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

  qa-app-windows:
    name: QA 试用安装包 (Windows)
    needs: [web-gate, rust-gate]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # fang 兄弟仓库检出：tauri build 的 beforeBuildCommand 会跑 npm run build（tsc 需 ../fang）
      - name: 检出 fang（alias 联调的兄弟仓库）
        uses: actions/checkout@v4
        with:
          repository: Bai-Gong/fang
          ref: 21c522dba3c1444060c5cd6ebd4e6760d21f9b38
          path: fang
      # checkout 只允许工作区内路径，检出到 fang/ 后挪到兄弟目录 ../fang
      - name: fang 挪到兄弟目录
        run: mv fang ../fang
      # ye 兄弟仓库检出（原因见 ci.yml 同名步骤注释；tauri build 需 ../ye）
      - name: 检出 ye（ye 引擎依赖的兄弟仓库）
        uses: actions/checkout@v4
        with:
          repository: Bai-Gong/ye
          ref: e30724896b8bc8e645b86d1585bb51acdcfef6c1
          path: ye
      - name: ye 挪到兄弟目录
        run: mv ye ../ye
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装 fang 依赖
        run: npm ci --prefix ../fang
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装依赖
        run: npm ci
      # 透传 Actions 自带 token：GitHub API 匿名 60 次/时/IP 在共享出口 IP 的托管 runner 上
      # 极易撞限（本机已实测 403 耗尽）；自带 token 额度 1000 次/时/仓库，单次打包仅需
      # 1 次 release 查询。下载本体走 browser_download_url 不占 API 限流。
      # 只产 NSIS 安装包：WiX(MSI) 的 codepage 1252 无法编码中文产品名（zhi 仓库实测 LGHT0311）
      - name: 构建 Tauri 安装包
        run: npm run package:windows
      - name: 上传试用安装包
        uses: actions/upload-artifact@v4
        with:
          name: qa-windows-installers
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
          if-no-files-found: warn
